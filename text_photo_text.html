<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://raw.githubusercontent.com/caiohag/inspira-templates/main/_base.css">
<style>
.text-top {
  position: absolute;
  left: 86px; right: 86px; top: 74px;
}
.text-top .h-serif {
  font-size: 70px;
  line-height: 1.08;
}
.photo-wrap {
  position: absolute;
  left: 50%; top: 344px;
  transform: translateX(-50%);
  width: 810px;
  height: 570px;
}
.photo-wrap .photo-card { width: 100%; height: 100%; padding: 28px; }
.text-bot {
  position: absolute;
  left: 86px; right: 86px;
  top: 948px;
}
.text-bot .h-serif {
  font-size: 56px;
  line-height: 1.15;
  color: var(--vinho);
  opacity: .9;
}
.cta { position: absolute; right: 60px; bottom: 30px; }
.logo-bot {
  position: absolute;
  left: 50%; bottom: 78px;
  transform: translateX(-50%);
}
.logo-img-footer { height: 38px; width: auto; display: block; }
</style>
</head>
<body>
<div class="canvas stripes-verde">
  <div class="text-top">
    <span class="h-serif h-3">{{text_top}}</span>
  </div>
  <div class="photo-wrap">
    <div class="photo-card">
      <div class="photo" style="background-image: url('{{image}}'); background-position: {{image_position}};"></div>
    </div>
  </div>
  <div class="text-bot">
    <span class="h-serif h-4">{{text_bottom}}</span>
  </div>
  <div class="logo-bot">
    <img src="https://frbdhxiwkwjawdifsiya.supabase.co/storage/v1/object/public/imagens/logo-escuro.png" alt="Inspira" class="logo-img-footer" />
  </div>
  <div class="cta cta-pass">
    <svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 32 C 35 24, 75 38, 115 30 C 145 24, 165 28, 185 32"
            stroke="#F5B89E" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M163 16 L 192 32 L 163 48"
            stroke="#F5B89E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </div>
</div>
</body>
</html>
